<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- B4 — Défense en profondeur. Ce site exécute une charge utile venue
       d'un fragment d'URL : si jamais un jour quelque chose échappait à
       safeImage() ou à escapeHtml(), cette ligne reste entre l'injection et
       son exécution.

       Trois précautions dans le choix des directives :
       · `frame-ancestors` est ABSENT, et il l'est exprès. Il est de toute
         façon ignoré dans un <meta> — mais le poser dans un en-tête tuerait
         le mode embarqué, dont toute la raison d'être est d'être encadré
         par le site de quelqu'un d'autre.
       · `img-src https:` accepte n'importe quelle image distante : c'est la
         promesse faite aux auteurs, qui collent l'adresse d'une couverture.
       · `connect-src` nomme les trois hôtes de l'espace partagé. Sans eux,
         publier cesserait de fonctionner en silence. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    frame-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self';
    form-action 'self';
    connect-src 'self' https://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;
  ">
  <title>RecoHero — la reco dont vous êtes le héros</title>
  <meta name="description" content="Des questionnaires qui comptent les étoiles et les ronds, et qui finissent par une recommandation culturelle.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✦</text></svg>">
  <link rel="stylesheet" href="css/foundation.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>

  <a class="skip-link" href="#main">Aller au contenu</a>

  <header class="topbar">
    <div class="page topbar__inner">
      <!-- L'identité par défaut est la nôtre. Dans un espace, gallery.js la
           remplace par celle de la structure — et si l'espace n'en a pas
           défini, celle-ci reste : mieux vaut une marque assumée qu'une
           page anonyme. -->
      <a class="brand" href="index.html" id="marque">
        <span class="brand__mark" id="marqueSigne">✦</span>
        <span id="marqueNom">RecoHero</span>
        <span class="brand__tagline" id="marqueAccroche">la reco dont vous êtes le héros</span>
      </a>
      <span class="topbar__spacer"></span>
      <span class="topbar__sortie" id="sortieHaut">
        <a class="btn btn--ghost btn--sm" href="admin.html">Backoffice</a>
      </span>
    </div>
  </header>

  <main id="main">
    <div class="page">

      <section class="hero">
        <h1 class="hero__title" id="heroTitre">La reco dont vous êtes <em>le héros</em></h1>
        <p class="hero__intro" id="heroIntro" hidden></p>
      </section>

      <section class="section">
        <div class="section__head">
          <h2>Les questionnaires</h2>
          <span class="section__spacer"></span>
          <span class="pill" id="quizCount"></span>
        </div>
        <div class="quiz-grid" id="quizGrid"></div>
      </section>

      <section class="section" id="historySection" hidden>
        <div class="section__head">
          <h2>Vos résultats</h2>
          <span class="section__spacer"></span>
          <button class="btn btn--quiet btn--sm" type="button" id="clearHistory">Effacer</button>
        </div>
        <div class="history" id="history"></div>
      </section>

      <footer class="footer">
        <span id="piedTexte">RecoHero — statique, sans compte, sans serveur.</span>
        <span class="footer__spacer"></span>
        <a href="admin.html" id="piedLien">Créer un questionnaire</a>
      </footer>

    </div>
  </main>

  <script type="module" src="js/gallery.js"></script>
</body>
</html>
