# quizzes/index.json est la liste des questionnaires servis au kiosque.
# L'écrire à la main est l'étape la plus fragile de la publication : une
# faute de frappe ne produit aucune erreur, le questionnaire n'apparaît
# simplement pas. Ce workflow la reconstruit à partir du dossier lui-même.
#
# Un site statique ne peut pas lister un répertoire ; c'est donc au dépôt de
# le faire, une fois, au moment où il change.

name: Indexer les questionnaires

on:
  push:
    branches: [main]
    paths: ['quizzes/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-quizzes
  cancel-in-progress: false

jobs:
  indexer:
    runs-on: ubuntu-latest
    # Sans ce garde, le commit du robot déclencherait le workflow qui l'a
    # produit. La seconde exécution ne trouverait rien à changer et
    # s'arrêterait — mais autant ne pas la lancer du tout.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruire quizzes/index.json
        run: |
          find quizzes -maxdepth 1 -name '*.json' ! -name 'index.json' -printf '%f\n' \
            | LC_ALL=C sort \
            | jq -R . | jq -s . > quizzes/index.json.new
          mv quizzes/index.json.new quizzes/index.json
          echo "Index reconstruit :"
          cat quizzes/index.json

      # L'étagère des brouillons partagés. Le `-maxdepth 1` de l'étape
      # précédente ne descend pas ici : rien de ce dossier n'entre jamais
      # dans quizzes/index.json, donc rien n'atteint le kiosque. C'est
      # exactement ce qu'on lui demande — partager n'est pas publier.
      - name: Reconstruire quizzes/wip/index.json
        run: |
          if [ ! -d quizzes/wip ]; then
            echo "Pas d'étagère de brouillons, rien à faire."
            exit 0
          fi
          find quizzes/wip -maxdepth 1 -name '*.json' ! -name 'index.json' -printf '%f\n' \
            | LC_ALL=C sort \
            | jq -R . | jq -s . > quizzes/wip/index.json.new
          mv quizzes/wip/index.json.new quizzes/wip/index.json
          echo "Index des brouillons reconstruit :"
          cat quizzes/wip/index.json

      - name: Committer si un index a changé
        run: |
          # `git add` refuse un chemin qui n'existe pas : l'étagère est
          # facultative, on ne l'ajoute que si elle est là.
          INDEXES='quizzes/index.json'
          [ -f quizzes/wip/index.json ] && INDEXES="$INDEXES quizzes/wip/index.json"

          if git diff --quiet -- $INDEXES; then
            echo "Index déjà à jour, rien à committer."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- $INDEXES
          git commit -m 'Réindexer les questionnaires [skip ci]'
          git push
