# La clé d'API Firebase de js/core/remote.js est publique par conception.
#
# Dans une application web, cette clé est un IDENTIFIANT de projet, pas un
# mot de passe : elle est lisible dans le trafic réseau de n'importe quel
# visiteur, quoi qu'on fasse. Aucune cachette n'existe pour un site
# statique — un gist, un secret d'action, tout finit dans le navigateur.
#
# Ce qui protège les données est ailleurs, et côté serveur : les règles de
# la base (firebase.rules.json). La clé ne donne aucun droit d'écriture.
#
# La rotation ne servirait à rien : la nouvelle clé serait tout aussi
# publique le jour même. Les vraies mesures sont dans NOTES-REGLES.md,
# § « La clé publique et l'alerte de GitHub ».
#
# Cette exclusion évite que l'alerte revienne à chaque commit touchant ce
# fichier — pas pour taire un problème, mais pour qu'une alerte future
# signifie encore quelque chose.

paths-ignore:
  - 'js/core/remote.js'
